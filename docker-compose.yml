# 폴더 이름이 한글이면 compose 프로젝트 이름이 비어 bootRun이 실패하므로 이름을 고정한다
name: hankki-atti

services:
  mysql:
    image: mysql:8.4
    container_name: hankki-atti-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: hankki_atti_db
      MYSQL_USER: hankki
      MYSQL_PASSWORD: hankki
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  # 로컬 메일 확인용 SMTP (실제로 보내지 않음). 웹 화면: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: hankki-atti-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data:
