# 폴더 이름이 한글이면 compose 프로젝트 이름이 비어 bootRun이 실패하므로 이름을 고정한다
name: hankki-atti

services:
  mysql:
    image: mysql:8.4
    container_name: hankki-atti-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: hankki_atti_db
      MYSQL_USER: hankki
      MYSQL_PASSWORD: hankki
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
