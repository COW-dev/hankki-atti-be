name: Deploy

# 이미 업로드된 이미지로 배포를 재시도하거나 이전 버전으로 되돌릴 때도 사용한다
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      DEPLOY_SSH_KEY:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: '배포할 기존 이미지 태그 (예: v0.50.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-manifest:
    # 수동 실행도 main에 병합된 워크플로우만 허용한다
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: backend-deploy-manifest
      cancel-in-progress: false
    env:
      IMAGE_NAME: ghcr.io/cow-dev/hankki-atti-be
      VERSION: ${{ inputs.version }}
      DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY }}
    steps:
      - name: 배포 설정 확인
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_REPOSITORY" || { echo '::error::DEPLOY_REPOSITORY 변수가 필요합니다'; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo '::error::DEPLOY_SSH_KEY Secret이 필요합니다'; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::이미지 태그는 vX.Y.Z 형식이어야 합니다'; exit 1; }

      - name: 기존 이미지 확인
        run: docker manifest inspect "$IMAGE_NAME:$VERSION" > /dev/null

      - name: 배포 저장소 checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.DEPLOY_REPOSITORY }}
          ref: main
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: 배포 이미지 버전 갱신
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('k8s/be/atti-be.yaml')
          source = path.read_text(encoding='utf-8')
          image = os.environ['IMAGE_NAME']
          target = image + ':' + os.environ['VERSION']
          pattern = r'(?m)^(\s*image:\s*)' + re.escape(image) + r'(?::[^\s#]+|@[^\s#]+)([ \t]*(?:#.*)?)$'
          updated, count = re.subn(pattern, lambda match: match[1] + target + match[2], source)
          if count != 1:
              raise SystemExit('대상 이미지가 정확히 한 개 있어야 합니다')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: 배포 저장소에 커밋 및 push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- k8s/be/atti-be.yaml
          if git diff --cached --quiet; then
            echo '이미 같은 이미지 버전입니다'
            exit 0
          fi
          git commit -m "ci: 백엔드 배포 이미지 $VERSION 반영"
          git push origin HEAD:main
