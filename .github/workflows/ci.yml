name: CI

# push는 main에만 건다. 작업 브랜치까지 걸면 PR마다 push CI와 PR CI가 중복 실행된다.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# PR은 새 push가 오면 이전 실행을 취소하고, main은 배포가 중간에 끊기지 않도록 순서대로 실행한다
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # check 단계에서 전체 라인 커버리지 70% 미만이면 실패한다 (jacocoTestCoverageVerification)
      - name: Build and test
        run: ./gradlew build

      - uses: actions/setup-python@v7
        if: github.event_name == 'pull_request'
        with:
          python-version: '3.13'

      - name: Diff coverage gate (변경 코드 80% 이상)
        if: github.event_name == 'pull_request'
        run: |
          # 버전을 고정한다. 미고정 시 업스트림 변경만으로 게이트가 오작동할 수 있다.
          pip install diff-cover==10.6.0
          git fetch origin ${{ github.base_ref }}
          diff-cover build/reports/jacoco/test/jacocoTestReport.xml \
            --compare-branch origin/${{ github.base_ref }} \
            --src-roots src/main/java \
            --fail-under=80

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks (시크릿 스캔)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml \
            --no-banner --redact --exit-code 1

  agent-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 에이전트 설정 구조 검증 (심링크/CLAUDE.md)
        run: |
          set -e
          test -d .agents/commands || { echo "::error::.agents/commands 없음"; exit 1; }
          test -L .claude/commands && test -e .claude/commands || { echo "::error::.claude/commands 심링크 깨짐"; exit 1; }
          test -L .codex/commands && test -e .codex/commands || { echo "::error::.codex/commands 심링크 깨짐"; exit 1; }
          grep -q "@AGENTS.md" CLAUDE.md || { echo "::error::CLAUDE.md에 @AGENTS.md import 없음"; exit 1; }
          echo "OK"

  # main 병합 후 모든 검사가 통과하면 배포 여부·버전을 정하고 git 태그로 버전을 선점한다
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, secret-scan, agent-config]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 배포 여부·버전 결정
        id: version
        run: bash .github/scripts/release-version.sh

      # 이미지보다 태그를 먼저 push한다 — 동시에 같은 버전을 노리면 여기서 실패해 이미지가 덮어써지지 않는다
      - name: 버전 태그 push
        if: steps.version.outputs.new_tag == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

  docker:
    if: needs.version.outputs.release == 'true'
    needs: version
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: mjucow/hankki-atti-be
      VERSION: ${{ needs.version.outputs.version }}

    # 스모크 테스트용. 테스트는 H2라 실제 MySQL·prod 설정·Dockerfile 문제는 여기서만 잡힌다
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hankki_atti_db
          MYSQL_USER: hankki
          MYSQL_PASSWORD: hankki
          MYSQL_ROOT_PASSWORD: root
          TZ: Asia/Seoul
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 스모크 테스트용 이미지 빌드 (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 스모크 테스트 (prod 프로필 + MySQL로 기동 후 health UP 확인)
        run: |
          docker run -d --name app --network host \
            -e SPRING_DATASOURCE_URL='jdbc:mysql://127.0.0.1:3306/hankki_atti_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8' \
            -e SPRING_DATASOURCE_USERNAME=hankki \
            -e SPRING_DATASOURCE_PASSWORD=hankki \
            "$IMAGE_NAME:smoke"
          for _ in $(seq 1 45); do
            # health가 DOWN이면 503이라 curl -f가 실패한다
            if curl -fsS http://localhost:8080/actuator/health; then
              echo; echo "기동 확인"; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != "true" ]; then
              echo "::error::컨테이너가 기동 중 종료됨"; break
            fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: 이미지 push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
