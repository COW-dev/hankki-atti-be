spring:
  application:
    name: hankki-atti
  task:
    scheduling:
      # 기본 1개면 한 작업(메일 발송 등)이 늦어질 때 다른 예약 작업까지 밀린다
      pool:
        size: 4
      thread-name-prefix: scheduling-
      shutdown:
        await-termination: true
        await-termination-period: 30s
  mail:
    # 접속 정보(host·port·username·password)는 환경별 설정 또는 SPRING_MAIL_* 환경 변수로 넣는다
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # SMTP가 응답하지 않을 때 메일 스레드가 오래 묶이지 않게
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  profiles:
    default: local
  datasource:
    hikari:
      # 기본 10은 의식적으로 정한 값이 아니어서 명시한다. 쓰기 요청은 커밋 직후 알림 relay(REQUIRES_NEW)가 업무 커넥션을 반납하기 전에
      # 두 번째 커넥션을 받으므로 요청 하나가 커넥션 2개를 쓸 수 있다. 여기에 스케줄러 4 + 메일 4 + 문자 2 스레드가 더해진다.
      # MySQL max_connections 기본 151이라 서버 2대(40)도 여유가 있다. 꽉 차면 connection-timeout(기본 30초) 뒤 500
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        default_batch_fetch_size: 100

# 인증 설정 — 값 설명은 global/security/AuthProperties 참고
auth:
  jwt:
    issuer: hankki-atti
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  token-cleanup:
    # 만료된 refresh·비밀번호 재설정 토큰을 매일 04:30에 지운다 (domain/auth/scheduler/TokenCleanupJob)
    enabled: true

mail:
  # Gmail은 로그인한 계정 주소로만 보낼 수 있어 계정 주소를 그대로 쓴다
  from-address: ${spring.mail.username:no-reply@hankki-atti.local}
  # 메일 본문 링크(비밀번호 재설정 등)의 기준 주소 — 받는 사람 역할의 앱. 장애학생 앱 / 도우미 앱(helper. 서브도메인)
  link-base-url: ${MAIL_LINK_BASE_URL:http://localhost:3000}
  helper-link-base-url: ${MAIL_LINK_BASE_URL_HELPER:http://helper.localhost:3000}
  outbox:
    poll-interval: PT10S
    batch-size: 20
    # 1분 간격으로 3번 재시도 (총 4번 시도)
    retry-delays: 1m,1m,1m
    claim-timeout: 5m

# 문자 발송 — 값 설명은 domain/sms/service/SmsProperties 참고
sms:
  sns:
    # true면 AWS SNS로 보낸다. 자격 증명은 환경 변수 AWS_ACCESS_KEY_ID·AWS_SECRET_ACCESS_KEY (저장소에 넣지 않는다)
    enabled: ${SMS_SNS_ENABLED:false}
    region: ${SMS_SNS_REGION:ap-northeast-2}
    # SNS가 응답하지 않을 때 문자 스레드가 묶이는 최대 시간 (시도 1회 / 재시도 포함 전체)
    api-call-attempt-timeout: 3s
    api-call-timeout: 10s
  outbox:
    poll-interval: PT10S
    batch-size: 20
    retry-delays: 1m,1m,1m
    claim-timeout: 5m

# 알림 작업 처리 — 값 설명은 domain/notification/service/NotificationJobProperties 참고
notification:
  job:
    poll-interval: PT10S
    batch-size: 50
    # 1분 간격으로 3번 재시도 (총 4번 시도)
    retry-delays: 1m,1m,1m
    claim-timeout: 5m

management:
  health:
    mail:
      # SMTP 연결 문제로 서버 상태가 DOWN이 되면 쿠버네티스가 서버를 재시작한다. 메일은 아웃박스가 재시도한다
      enabled: false
