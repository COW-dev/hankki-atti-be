spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hankki_atti_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:hankki}
    password: ${SPRING_DATASOURCE_PASSWORD:hankki}

  jpa:
    # enum 컬럼 CHECK 제약을 만들지 않는다 (NoColumnCheckMySQLDialect 주석 참고)
    database-platform: com.hankkiatti.global.config.NoColumnCheckMySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    # docker-compose의 Mailpit. 보낸 메일은 http://localhost:8025 에서 본다
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false

  docker:
    compose:
      lifecycle-management: start-only

auth:
  jwt:
    # 비워 두면 서버를 켤 때마다 임의 키를 쓴다 (재시작하면 다시 로그인)
    secret: ${JWT_SECRET:}
  refresh-cookie:
    # 로컬은 http라 Secure 쿠키를 쓰지 않는다 (쿠키 이름에 __Host- 접두사도 붙지 않음)
    secure: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
