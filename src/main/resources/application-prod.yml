spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      # 내부 개발 서버 단계라 엔티티 변경을 자동 반영한다. 실제 운영 전 Flyway + validate로 전환할 것
      ddl-auto: update
    show-sql: false
