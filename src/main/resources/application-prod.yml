spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    # enum 컬럼 CHECK 제약을 만들지 않는다 (NoColumnCheckMySQLDialect 주석 참고)
    database-platform: com.hankkiatti.global.config.NoColumnCheckMySQLDialect
    hibernate:
      # 내부 개발 서버 단계라 엔티티 변경을 자동 반영한다. 실제 운영 전 Flyway + validate로 전환할 것
      ddl-auto: update
    show-sql: false

auth:
  jwt:
    # 없으면 기동할 때 임의 키를 만든다. 재시작하면 access 토큰만 무효가 되고, 프론트가 refresh로 새로 받으므로 다시 로그인할 필요는 없다.
    # 서버를 2대 이상 띄우면 같은 키가 필요하다 → JWT_SECRET 지정 (생성: openssl rand -base64 32)
    secret: ${JWT_SECRET:}
  cors:
    # 쉼표로 구분한 정확한 프론트 출처 (예: https://app.bluerack.org,https://admin.bluerack.org).
    # 비어 있으면 브라우저의 다른 출처 요청을 모두 막는다. 서브도메인이 정해지면 기본값을 여기에 적는다
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# 메일 본문 링크 주소: MAIL_LINK_BASE_URL=<사용자 앱 주소> (예: https://app.bluerack.org). 없으면 http://localhost:3000.
#   서브도메인이 정해지면 기본값을 여기에 적는다
# 문자: SMS_SNS_ENABLED=true, SMS_SNS_REGION=ap-northeast-2(기본), AWS_ACCESS_KEY_ID·AWS_SECRET_ACCESS_KEY(sns:Publish만 허용한 IAM 키).
#   꺼져 있으면 문자는 발송 대기로 남는다 (설정하면 그때 발송)
# 메일: spring.mail.host가 없으면 메일을 보내지 않고 발송 대기로 둔다 (설정하면 그때 발송).
# Gmail SMTP — SPRING_MAIL_HOST=smtp.gmail.com, SPRING_MAIL_PORT=587,
#              SPRING_MAIL_USERNAME=<서비스 전용 Gmail>, SPRING_MAIL_PASSWORD=<앱 비밀번호>
