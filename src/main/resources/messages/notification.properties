# 인앱 알림 문구 (NotificationMessages가 읽는다)
# - 키 = 알림 종류(NotificationType) 이름. 나중에 알림톡 등으로 옮기면 템플릿 코드로 쓴다
# - {0} = 식사 시각 "10월 12일(월) 12:00" (코드가 만든다). 그 밖의 자리표시자는 키 위 주석 참고
# - 시각과 상태만 쓴다. 이름·장애 유형·특이사항·메모는 넣지 않는다
# - 작은따옴표(')는 두 번('') 써야 한다 (MessageFormat 규칙)
# - 알림 문장은 200자 이내

# 장애학생
notification.REQUEST_MATCHED={0} 식사 도우미가 매칭됐어요.
notification.HELPER_CHANGED={0} 식사 도우미가 바뀌었어요.
notification.REQUEST_REOPENED={0} 신청의 도우미가 빠져 다시 모집 중이에요.
notification.REQUEST_FAILED={0} 신청에 도우미가 매칭되지 않았어요.

# 도우미
notification.APPLICATION_MATCHED={0} 식사 도우미로 매칭됐어요.
# {1} = 예비 순번
notification.WAITING_REGISTERED={0} 신청에 예비 {1}번으로 등록됐어요.
notification.PROMOTED={0} 신청에 예비에서 매칭으로 승격됐어요.
# {1} = 응답 마감 시각 "11:45"
notification.PROMOTION_RESPONSE_REQUIRED={0} 신청에 예비에서 승격됐어요. {1}까지 갈 수 있는지 알려 주세요.
# 식사 30분 전 재알림. {0} = 위 문장 전체
notification.PROMOTION_RESPONSE_REQUIRED.reminder=다시 알려 드려요. {0}
notification.STUDENT_CANCELED={0} 신청이 장애학생 사정으로 취소됐어요.
notification.WAITING_EXCLUDED={0} 예비 자리가 같은 시간 다른 매칭으로 빠졌어요.

# ---------------------------------------------------------------------------
# 이메일·문자 (급한 알림 4종: 매칭 완료·예비에서 승격·상대방 취소·매칭 실패)
# - 메일 본문은 인앱 문장 + 앱 링크 1개 + 센터 연락처, 텍스트만
# - 문자는 [한끼아띠]로 시작, 링크 없음, 한 통(70자) 안
# ---------------------------------------------------------------------------

# 메일 본문. {0} = 인앱 문장, {1} = 앱 링크
mail.body={0}\n\n자세한 내용은 한끼아띠에서 확인해 주세요.\n{1}\n\n명지대학교 장애학생지원센터 02-300-1529

mail.REQUEST_MATCHED.subject=[한끼아띠] 식사 도우미가 매칭됐어요
mail.APPLICATION_MATCHED.subject=[한끼아띠] 식사 도우미로 매칭됐어요
mail.PROMOTED.subject=[한끼아띠] 예비에서 매칭으로 승격됐어요
mail.PROMOTION_RESPONSE_REQUIRED.subject=[한끼아띠] 예비에서 승격됐어요. 갈 수 있는지 알려 주세요
mail.PROMOTION_RESPONSE_REQUIRED.reminder.subject=[한끼아띠] 다시 알림: 승격 응답을 기다리고 있어요
mail.STUDENT_CANCELED.subject=[한끼아띠] 신청이 장애학생 사정으로 취소됐어요
mail.REQUEST_FAILED.subject=[한끼아띠] 도우미가 매칭되지 않았어요

# 문자. {0} = 식사 시각
sms.REQUEST_MATCHED=[한끼아띠] {0} 식사 도우미가 매칭됐어요. 앱에서 확인해 주세요.
sms.APPLICATION_MATCHED=[한끼아띠] {0} 식사 도우미로 매칭됐어요. 앱에서 확인해 주세요.
sms.PROMOTED=[한끼아띠] {0} 신청에 예비에서 매칭으로 승격됐어요.
# {1} = 응답 마감 시각 "11:45"
sms.PROMOTION_RESPONSE_REQUIRED=[한끼아띠] {0} 예비에서 승격됐어요. {1}까지 앱에서 응답해 주세요.
sms.PROMOTION_RESPONSE_REQUIRED.reminder=[한끼아띠] 다시 알림: {0} 승격 응답을 {1}까지 앱에서 해 주세요.
sms.STUDENT_CANCELED=[한끼아띠] {0} 신청이 장애학생 사정으로 취소됐어요.
sms.REQUEST_FAILED=[한끼아띠] {0} 신청에 도우미가 매칭되지 않았어요.
