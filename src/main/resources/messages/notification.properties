# 인앱 알림 문구 (NotificationMessages가 읽는다)
# - 키 = 알림 종류(NotificationType) 이름. 나중에 알림톡 등으로 옮기면 템플릿 코드로 쓴다
# - {0} = 식사 시각 "10월 12일(월) 12:00" (코드가 만든다). 그 밖의 자리표시자는 키 위 주석 참고
# - 시각과 상태만 쓴다. 이름·장애 유형·특이사항·메모는 넣지 않는다
# - 작은따옴표(')는 두 번('') 써야 한다 (MessageFormat 규칙)
# - 알림 문장은 200자 이내

# 장애학생
notification.REQUEST_MATCHED={0} 식사 도우미가 매칭됐어요.
notification.HELPER_CHANGED={0} 식사 도우미가 바뀌었어요.
notification.REQUEST_REOPENED={0} 신청의 도우미가 빠져 다시 모집 중이에요.
notification.REQUEST_FAILED={0} 신청에 도우미가 매칭되지 않았어요.

# 도우미
notification.APPLICATION_MATCHED={0} 식사 도우미로 매칭됐어요.
# {1} = 예비 순번
notification.WAITING_REGISTERED={0} 신청에 예비 {1}번으로 등록됐어요.
notification.PROMOTED={0} 신청에 예비에서 매칭으로 승격됐어요.
# {1} = 응답 마감 시각 "11:45"
notification.PROMOTION_RESPONSE_REQUIRED={0} 신청에 예비에서 승격됐어요. {1}까지 갈 수 있는지 알려 주세요.
# 식사 30분 전 재알림. {0} = 위 문장 전체
notification.PROMOTION_RESPONSE_REQUIRED.reminder=다시 알려 드려요. {0}
notification.STUDENT_CANCELED={0} 신청이 장애학생 사정으로 취소됐어요.
notification.WAITING_EXCLUDED={0} 예비 자리가 같은 시간 다른 매칭으로 빠졌어요.
